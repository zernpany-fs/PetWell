<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="830" viewBox="0 0 1320 830" xmlns:c2pa="http://c2pa.org/manifest"><style>text{font-family:Helvetica,Arial,sans-serif}.t1{font-size:13px;font-weight:bold;fill:#222}.t{font-size:11.5px;fill:#333}.ref{font-size:10.5px;fill:#1F6B42;font-weight:bold}.el{font-size:11px;fill:#B7791F;font-weight:bold}.note{font-size:12px;fill:#444}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><path d="M660,97 L660,142" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/><path d="M560,190 L180,190 L180,295" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/><text x="174" y="212" class="el" text-anchor="end">CONFIRMED</text><path d="M560,190 L500,190 L500,454" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/><text x="494" y="212" class="el" text-anchor="end">RESCHEDULED</text><path d="M760,190 L820,190 L820,295" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/><text x="826" y="212" class="el" text-anchor="start">COMPLETED</text><path d="M760,190 L1140,190 L1140,295" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/><text x="1146" y="212" class="el" text-anchor="start">REJECTED / CANCELLED</text><path d="M180,395 L180,417 L105,417 L105,454" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/><text x="99" y="433" class="el" text-anchor="end">No</text><path d="M180,395 L180,417 L255,417 L255,454" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/><text x="261" y="433" class="el" text-anchor="start">Yes</text><path d="M820,395 L820,417 L745,417 L745,454" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/><text x="739" y="433" class="el" text-anchor="end">Yes</text><path d="M820,395 L820,417 L895,417 L895,454" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/><text x="901" y="433" class="el" text-anchor="start">No</text><path d="M1140,395 L1140,417 L1065,417 L1065,454" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/><text x="1059" y="433" class="el" text-anchor="end">Yes</text><path d="M1140,395 L1140,417 L1215,417 L1215,454" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/><text x="1221" y="433" class="el" text-anchor="start">No</text><path d="M105,546 L105,625" fill="none" stroke="#555" stroke-width="1.4"/><path d="M255,546 L255,625" fill="none" stroke="#555" stroke-width="1.4"/><path d="M500,546 L500,625" fill="none" stroke="#555" stroke-width="1.4"/><path d="M745,546 L745,625" fill="none" stroke="#555" stroke-width="1.4"/><path d="M895,546 L895,625" fill="none" stroke="#555" stroke-width="1.4"/><path d="M1065,546 L1065,625" fill="none" stroke="#555" stroke-width="1.4"/><path d="M1215,546 L1215,625" fill="none" stroke="#555" stroke-width="1.4"/><path d="M105,625 L1215,625" fill="none" stroke="#555" stroke-width="1.4"/><path d="M660,625 L660,658" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/><rect x="425.0" y="23.0" width="470" height="74" rx="14" fill="#DCE6F5" stroke="#2E5FA3" stroke-width="1.5"/><text x="660" y="49" class="t1" text-anchor="middle">Appointment A changes status</text><text x="660" y="64" class="t" text-anchor="middle">clinic updateStatus · owner cancel · owner archives pet</text><text x="660" y="79" class="t" text-anchor="middle">all inside one $transaction</text><polygon points="660,142.0 760.0,190 660,238.0 560.0,190" fill="#FFF4DC" stroke="#B7791F" stroke-width="1.5"/><text x="660" y="194" class="t1" text-anchor="middle">New status?</text><polygon points="180,295.0 285.0,345 180,395.0 75.0,345" fill="#FFF4DC" stroke="#B7791F" stroke-width="1.5"/><text x="180" y="342" class="t1" text-anchor="middle">Grant G for A</text><text x="180" y="356" class="t" text-anchor="middle">exists?</text><rect x="35.0" y="454.0" width="140" height="92" rx="4" fill="#DDF0E4" stroke="#1F6B42" stroke-width="1.5"/><text x="105" y="482" class="t1" text-anchor="middle">Create G</text><text x="105" y="496" class="t" text-anchor="middle">type = APPOINTMENT</text><text x="105" y="512" class="t" text-anchor="middle">expires_at = null</text><text x="105" y="526" class="ref" text-anchor="middle">D1</text><rect x="185.0" y="454.0" width="140" height="92" rx="4" fill="#F2F2F2" stroke="#888888" stroke-width="1.5"/><text x="255" y="482" class="t1" text-anchor="middle">No change</text><text x="255" y="496" class="t" text-anchor="middle">no duplicate,</text><text x="255" y="512" class="t" text-anchor="middle">revoked stays ended</text><text x="255" y="526" class="ref" text-anchor="middle">US-01 AC3, D13</text><rect x="420.0" y="454.0" width="160" height="92" rx="4" fill="#F2F2F2" stroke="#888888" stroke-width="1.5"/><text x="500" y="489" class="t1" text-anchor="middle">No change</text><text x="500" y="504" class="t" text-anchor="middle">G keeps its state</text><text x="500" y="519" class="ref" text-anchor="middle">US-01 AC3</text><polygon points="820,295.0 925.0,345 820,395.0 715.0,345" fill="#FFF4DC" stroke="#B7791F" stroke-width="1.5"/><text x="820" y="342" class="t1" text-anchor="middle">G active?</text><text x="820" y="356" class="t" text-anchor="middle">(ended_at is null)</text><rect x="675.0" y="454.0" width="140" height="92" rx="4" fill="#DDF0E4" stroke="#1F6B42" stroke-width="1.5"/><text x="745" y="482" class="t1" text-anchor="middle">Set expiry</text><text x="745" y="496" class="t" text-anchor="middle">expires_at =</text><text x="745" y="512" class="t" text-anchor="middle">now + 30 days</text><text x="745" y="526" class="ref" text-anchor="middle">D2</text><rect x="825.0" y="454.0" width="140" height="92" rx="4" fill="#F2F2F2" stroke="#888888" stroke-width="1.5"/><text x="895" y="482" class="t1" text-anchor="middle">No change</text><text x="895" y="496" class="t" text-anchor="middle">ended G is not</text><text x="895" y="512" class="t" text-anchor="middle">reopened</text><text x="895" y="526" class="ref" text-anchor="middle">D23</text><polygon points="1140,295.0 1245.0,345 1140,395.0 1035.0,345" fill="#FFF4DC" stroke="#B7791F" stroke-width="1.5"/><text x="1140" y="342" class="t1" text-anchor="middle">G exists and</text><text x="1140" y="356" class="t" text-anchor="middle">is active?</text><rect x="995.0" y="454.0" width="140" height="92" rx="4" fill="#DDF0E4" stroke="#1F6B42" stroke-width="1.5"/><text x="1065" y="482" class="t1" text-anchor="middle">End G</text><text x="1065" y="496" class="t" text-anchor="middle">ended_at = now</text><text x="1065" y="512" class="t" text-anchor="middle">end_reason =</text><text x="1065" y="526" class="t" text-anchor="middle">new status · D4</text><rect x="1145.0" y="454.0" width="140" height="92" rx="4" fill="#F2F2F2" stroke="#888888" stroke-width="1.5"/><text x="1215" y="482" class="t1" text-anchor="middle">No change</text><text x="1215" y="496" class="t" text-anchor="middle">keeps REVOKED</text><text x="1215" y="512" class="t" text-anchor="middle">if revoked before</text><text x="1215" y="526" class="ref" text-anchor="middle">D12</text><rect x="400.0" y="658.0" width="520" height="64" rx="14" fill="#DCE6F5" stroke="#2E5FA3" stroke-width="1.5"/><text x="660" y="686" class="t1" text-anchor="middle">Commit: status change, status log and grant change</text><text x="660" y="702" class="t" text-anchor="middle">succeed or fail together</text><text x="40" y="770" class="note">PetWell V2 · Appointment status → access grant · green = grant changes · grey = no change · amber = decision</text><text x="40" y="790" class="note">G = the grant whose appointment_id = A (unique, D17). Active = ended_at IS NULL AND (expires_at IS NULL OR expires_at &gt; now). Expiry needs no job: it is checked on every read.</text><text x="40" y="810" class="note">Not in this chart (owner actions, not appointment status): share-code redeem (US-03), revoke (US-04 AC1–AC3), extend (US-04 AC4).</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
